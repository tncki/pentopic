name: Release

# 打 tag 即自动构建并发布，例如：
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 读取产品身份
        id: ident
        run: |
          # shellcheck disable=SC1091
          . ./app.conf
          echo "name=$APP_NAME"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"

      - name: 构建（通用二进制）
        run: ./build.sh --universal

      - name: 打包 zip（zip 能保留 .app 的符号链接与权限）
        run: |
          set -e
          APP=$(ls -d build/*.app | head -1)
          NAME=$(basename "$APP" .app)
          TAG="${GITHUB_REF_NAME:-v${{ steps.ident.outputs.version }}}"
          OUT="build/${NAME}-${TAG}-universal.zip"
          ditto -c -k --keepParent "$APP" "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: 生成校验和
        run: |
          cd build && shasum -a 256 *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME:-v${{ steps.ident.outputs.version }}}"
          # 手写的发布说明优先；没有才退回从提交自动生成。
          # 首个版本用自动生成的提交列表对用户没什么价值。
          if [ -f RELEASE-NOTES.md ]; then
            gh release create "$TAG" \
              --title "${{ steps.ident.outputs.name }} $TAG" \
              --notes-file RELEASE-NOTES.md \
              "$OUT" build/SHA256SUMS.txt
          else
            gh release create "$TAG" \
              --title "${{ steps.ident.outputs.name }} $TAG" \
              --generate-notes \
              "$OUT" build/SHA256SUMS.txt
          fi
          echo "已发布: $TAG"

