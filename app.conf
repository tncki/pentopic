# ============================================================================
#  应用身份配置（**这个文件会提交到仓库**，所以只放不含机密的信息）
#  CI 构建、别人 clone 后构建都读它。
# ============================================================================

APP_NAME="PentoPic"

EXECUTABLE="PentoPic"

# Bundle ID —— 采用 GitHub 开源项目的通用约定 io.github.<用户名>.<应用名>，
# 这样不需要自己拥有域名。（pentopic.com 已被他人注册，不适合用来做反写。）
#
# ⚠️ TODO: 已使用真实用户名 tncki —— 那之后要重新 ./build.sh，
#    并且 macOS 的屏幕录制授权会因为 Bundle ID 变化而需要重新授予一次。
BUNDLE_ID="io.github.tncki.pentopic"

VERSION="1.0.3"

COPYRIGHT="© 2026 Zhao Bin. Free software (MIT). Inspired by Pointofix by Thomas Gottfried EDV — not affiliated with, endorsed by, or derived from the original."

SCREEN_CAPTURE_DESC="PentoPic freezes your screen so you can draw and mark on top of it. Everything stays on your Mac — no network access, nothing is uploaded."
